name: Deploy to Infomaniak

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          PUBLIC_CONTACT_FORM_ENDPOINT: /api/contact.php
        run: npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install SMTP library
        run: composer install --working-dir=server --no-dev --prefer-dist --no-interaction --no-progress

      - name: Prepare PHP endpoint
        env:
          INFOMANIAK_SMTP_USERNAME: ${{ secrets.INFOMANIAK_SMTP_USERNAME }}
          INFOMANIAK_SMTP_PASSWORD: ${{ secrets.INFOMANIAK_SMTP_PASSWORD }}
        run: php server/package.php

      - name: Check PHP syntax
        run: find dist/api -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Deploy dist to Infomaniak (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.INFOMANIAK_FTP_HOST }}
          protocol: ftps
          username: ${{ secrets.INFOMANIAK_FTP_USERNAME }}
          password: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
          local-dir: dist/
          server-dir: ${{ secrets.INFOMANIAK_FTP_TARGET_DIR }}
